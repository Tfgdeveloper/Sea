<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/fav.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seawings Publication</title>

    <!-- Preconnect to external origins FIRST (reduces DNS/TLS latency) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://www.googletagmanager.com" />
    <link rel="preconnect" href="https://connect.facebook.net" />

    <!--
      Google Font: loaded non-blocking via media trick.
      The browser downloads it in the background; once loaded, media switches
      to "all" so styles apply — zero render-blocking.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Elms+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <!-- Fallback for no-JS (rare, but good practice) -->
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Elms+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      />
    </noscript>

    <!--
      Google Tag Manager — ONE script handles GA4 (G-0Y4TKYMTJC) AND
      Google Ads (AW-18088082704) via GTM tags. No need for separate gtag scripts.
      NOTE: Configure both tags inside your GTM container dashboard instead.
      The script below is async so it does NOT block rendering.
    -->
    <script>
      (function (w, d, s, l, i) {
        w[l] = w[l] || [];
        w[l].push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
        var f = d.getElementsByTagName(s)[0],
          j = d.createElement(s),
          dl = l != 'dataLayer' ? '&l=' + l : '';
        j.async = true; // already async — does not block rendering
        j.src = 'https://www.googletagmanager.com/gtm.js?id=' + i + dl;
        f.parentNode.insertBefore(j, f);
      })(window, document, 'script', 'dataLayer', 'GTM-N3KHK2TH');
    </script>

    <!--
      Facebook Pixel — deferred until after the page is interactive.
      Wrapping in requestIdleCallback (with setTimeout fallback) means it
      fires only when the browser is idle — invisible to users, +5-10 pts on PSI.
    -->
    <script>
      function loadFBPixel() {
        if (window.fbq) return;
        !(function (f, b, e, v, n, t, s) {
          if (f.fbq) return;
          n = f.fbq = function () {
            n.callMethod
              ? n.callMethod.apply(n, arguments)
              : n.queue.push(arguments);
          };
          if (!f._fbq) f._fbq = n;
          n.push = n;
          n.loaded = !0;
          n.version = '2.0';
          n.queue = [];
          t = b.createElement(e);
          t.async = !0;
          t.src = v;
          s = b.getElementsByTagName(e)[0];
          s.parentNode.insertBefore(t, s);
        })(window, document, 'script', 'https://connect.facebook.net/en_US/fbevents.js');
        fbq('init', '1747436043295581');
        fbq('track', 'PageView');
      }

      // Fire when browser is idle; fallback to 3s delay if requestIdleCallback unsupported
      if ('requestIdleCallback' in window) {
        requestIdleCallback(loadFBPixel, { timeout: 3000 });
      } else {
        setTimeout(loadFBPixel, 3000);
      }
    </script>

  </head>
  <body>

    <!-- GTM noscript fallback (required by Google) — keep at top of <body> -->
    <noscript>
      <iframe
        src="https://www.googletagmanager.com/ns.html?id=GTM-N3KHK2TH"
        height="1"
        width="1"
        style="display:none;visibility:hidden"
      ></iframe>
    </noscript>

    <!-- FB Pixel noscript fallback -->
    <noscript>
      <img
        height="1"
        width="1"
        style="display:none"
        src="https://www.facebook.com/tr?id=1747436043295581&ev=PageView&noscript=1"
        alt=""
      />
    </noscript>

    <div id="root"></div>

    <!-- Your React app entry — type="module" is already deferred by spec -->
    <script type="module" src="/src/main.jsx"></script>

  </body>
</html>
